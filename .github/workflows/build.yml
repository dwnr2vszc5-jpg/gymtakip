name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build for iOS
        run: |
          xcodebuild build -project GymTakip.xcodeproj -scheme GymTakip \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee ios.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" ios.log
      - name: Build for macOS
        if: always()
        run: |
          xcodebuild build -project GymTakip.xcodeproj -scheme GymTakip \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee mac.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" mac.log
